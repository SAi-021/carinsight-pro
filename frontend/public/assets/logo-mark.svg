<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="logoG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f0a500"/>
    </linearGradient>
    <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded gold tile background -->
  <rect x="8" y="8" width="104" height="104" rx="22" fill="url(#logoG)"/>

  <!-- Inner gauge dial -->
  <g transform="translate(60 60)" filter="url(#logoGlow)">
    <!-- Outer ring -->
    <circle r="38" fill="none" stroke="#080a0f" stroke-width="3" stroke-opacity="0.85"/>
    <!-- Tick marks (speedometer) -->
    <g stroke="#080a0f" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.85">
      <line x1="0" y1="-32" x2="0" y2="-26" transform="rotate(-120)"/>
      <line x1="0" y1="-32" x2="0" y2="-26" transform="rotate(-90)"/>
      <line x1="0" y1="-32" x2="0" y2="-26" transform="rotate(-60)"/>
      <line x1="0" y1="-32" x2="0" y2="-26" transform="rotate(-30)"/>
      <line x1="0" y1="-32" x2="0" y2="-26" transform="rotate(0)"/>
      <line x1="0" y1="-32" x2="0" y2="-26" transform="rotate(30)"/>
      <line x1="0" y1="-32" x2="0" y2="-26" transform="rotate(60)"/>
    </g>
    <!-- Minor ticks -->
    <g stroke="#080a0f" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.6">
      <line x1="0" y1="-32" x2="0" y2="-28" transform="rotate(-105)"/>
      <line x1="0" y1="-32" x2="0" y2="-28" transform="rotate(-75)"/>
      <line x1="0" y1="-32" x2="0" y2="-28" transform="rotate(-45)"/>
      <line x1="0" y1="-32" x2="0" y2="-28" transform="rotate(-15)"/>
      <line x1="0" y1="-32" x2="0" y2="-28" transform="rotate(15)"/>
      <line x1="0" y1="-32" x2="0" y2="-28" transform="rotate(45)"/>
    </g>
    <!-- Needle pointing top-right (high price/value direction) -->
    <path d="M 0 0 L 20 -18 L 24 -10 L 4 4 Z" fill="#080a0f"/>
    <circle r="5" fill="#080a0f"/>
    <circle r="2" fill="url(#logoG)"/>
  </g>
</svg>
