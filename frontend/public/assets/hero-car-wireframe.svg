<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- Gold glow filter for car body -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Vertical gradient on the car body lines (gold → amber → faint) -->
    <linearGradient id="gradBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fbbf24"/>
      <stop offset="55%"  stop-color="#f0a500"/>
      <stop offset="100%" stop-color="#b87300" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="gradAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f0a500"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Radial floor glow under the car -->
    <radialGradient id="floorGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#f0a500" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#f0a500" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#080a0f" stop-opacity="0"/>
    </radialGradient>

    <!-- Background vignette -->
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0%"  stop-color="#131720" stop-opacity="0"/>
      <stop offset="100%" stop-color="#080a0f" stop-opacity="1"/>
    </radialGradient>

    <!-- Grid floor perspective pattern -->
    <pattern id="gridFloor" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#f0a500" stroke-opacity="0.18" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- ============ BACKGROUND VIGNETTE ============ -->
  <rect width="800" height="600" fill="url(#vignette)"/>

  <!-- ============ PERSPECTIVE GRID FLOOR ============ -->
  <g opacity="0.55">
    <!-- Trapezoid floor with horizontal scan lines fading to horizon -->
    <path d="M 100 440 L 700 440 L 620 555 L 180 555 Z" fill="url(#gridFloor)"/>
    <!-- Receding horizontal lines -->
    <line x1="100" y1="440" x2="700" y2="440" stroke="#f0a500" stroke-opacity="0.45" stroke-width="0.8"/>
    <line x1="115" y1="463" x2="685" y2="463" stroke="#f0a500" stroke-opacity="0.32" stroke-width="0.7"/>
    <line x1="135" y1="488" x2="665" y2="488" stroke="#f0a500" stroke-opacity="0.24" stroke-width="0.6"/>
    <line x1="155" y1="515" x2="645" y2="515" stroke="#f0a500" stroke-opacity="0.16" stroke-width="0.55"/>
    <line x1="180" y1="555" x2="620" y2="555" stroke="#f0a500" stroke-opacity="0.10" stroke-width="0.5"/>
    <!-- Converging vertical guides -->
    <line x1="100" y1="440" x2="180" y2="555" stroke="#f0a500" stroke-opacity="0.30" stroke-width="0.6"/>
    <line x1="220" y1="440" x2="248" y2="555" stroke="#f0a500" stroke-opacity="0.22" stroke-width="0.6"/>
    <line x1="340" y1="440" x2="338" y2="555" stroke="#f0a500" stroke-opacity="0.22" stroke-width="0.6"/>
    <line x1="460" y1="440" x2="462" y2="555" stroke="#f0a500" stroke-opacity="0.22" stroke-width="0.6"/>
    <line x1="580" y1="440" x2="552" y2="555" stroke="#f0a500" stroke-opacity="0.22" stroke-width="0.6"/>
    <line x1="700" y1="440" x2="620" y2="555" stroke="#f0a500" stroke-opacity="0.30" stroke-width="0.6"/>
  </g>

  <!-- ============ FLOOR GLOW UNDER CAR ============ -->
  <ellipse cx="400" cy="440" rx="280" ry="55" fill="url(#floorGlow)"/>

  <!-- ============ CAR — 3/4 PERSPECTIVE SEDAN/SUV WIREFRAME ============ -->
  <g filter="url(#goldGlow)" stroke="url(#gradBody)" stroke-width="1.6" fill="none">

    <!-- Underbody / chassis line -->
    <path d="M 180 410 Q 200 425 240 425 L 560 425 Q 600 425 620 410"
          stroke-opacity="0.85"/>

    <!-- Main side profile (silhouette) -->
    <path d="M 175 380
             Q 175 355 195 340
             L 245 320
             Q 275 295 320 285
             L 470 282
             Q 525 285 555 305
             L 605 335
             Q 625 350 625 380
             L 625 410
             L 175 410 Z"
          stroke-width="2"/>

    <!-- Roof line -->
    <path d="M 245 320 Q 280 280 340 270 L 450 268 Q 510 272 545 295 L 580 320"
          stroke-width="1.6"/>

    <!-- Windshield -->
    <path d="M 280 320 L 320 285 L 360 280" stroke-width="1.3"/>
    <path d="M 360 280 L 360 320 L 280 320"/>

    <!-- Front side window -->
    <path d="M 365 280 L 365 320 L 425 320 L 425 280 Z" stroke-width="1.3"/>
    <!-- Rear side window -->
    <path d="M 430 280 L 430 320 L 510 320 L 530 290 L 470 282 Z" stroke-width="1.3"/>

    <!-- Roof contour pulled to back -->
    <path d="M 360 268 L 360 280 M 430 270 L 430 280 M 510 274 L 510 282"
          stroke-opacity="0.7"/>

    <!-- Hood line + crease -->
    <path d="M 180 380 L 240 360 L 285 345" stroke-width="1.3"/>
    <path d="M 200 395 L 250 380" stroke-opacity="0.55"/>

    <!-- Trunk line -->
    <path d="M 555 305 L 600 335 L 620 365" stroke-width="1.3"/>

    <!-- Body crease (mid-line on side) -->
    <path d="M 220 385 Q 350 372 480 372 Q 560 372 605 380"
          stroke-opacity="0.5" stroke-width="1"/>

    <!-- Front fender curve over wheel -->
    <path d="M 200 410 Q 215 365 260 360 Q 305 360 320 410"
          stroke-opacity="0.7"/>
    <!-- Rear fender curve over wheel -->
    <path d="M 480 410 Q 495 360 540 360 Q 585 360 600 410"
          stroke-opacity="0.7"/>

    <!-- Front grille / bumper detail -->
    <path d="M 175 392 L 165 395 L 165 410 L 175 410" stroke-width="1.1"/>
    <path d="M 168 398 L 175 398 M 168 403 L 175 403" stroke-opacity="0.55"/>

    <!-- Headlight -->
    <path d="M 180 370 L 200 365 L 215 372 L 210 380 L 185 382 Z"
          stroke-opacity="0.85" stroke-width="1.2"/>
    <!-- Headlight glow dot -->
    <circle cx="195" cy="374" r="2.2" fill="#fbbf24" stroke="none" filter="url(#softGlow)"/>

    <!-- Taillight -->
    <path d="M 620 365 L 615 380 L 605 380 L 605 365 Z"
          stroke-opacity="0.85" stroke-width="1.2"/>
    <circle cx="612" cy="372" r="1.8" fill="#ef4444" stroke="none" filter="url(#softGlow)" opacity="0.9"/>

    <!-- Door cut lines -->
    <line x1="365" y1="320" x2="365" y2="408" stroke-opacity="0.4"/>
    <line x1="425" y1="320" x2="425" y2="408" stroke-opacity="0.4"/>
    <line x1="510" y1="318" x2="510" y2="408" stroke-opacity="0.4"/>

    <!-- Door handles -->
    <line x1="385" y1="345" x2="405" y2="345" stroke-width="1.4"/>
    <line x1="445" y1="345" x2="470" y2="345" stroke-width="1.4"/>

    <!-- Side mirror -->
    <path d="M 322 305 L 312 308 L 312 318 L 322 320" stroke-opacity="0.7"/>

    <!-- ============ WHEELS ============ -->
    <!-- Front wheel -->
    <g>
      <circle cx="260" cy="415" r="32" stroke-width="2"/>
      <circle cx="260" cy="415" r="22" stroke-opacity="0.7" stroke-width="1.2"/>
      <circle cx="260" cy="415" r="8"  stroke-opacity="0.85" stroke-width="1.2"/>
      <!-- Spokes -->
      <line x1="260" y1="395" x2="260" y2="435" stroke-opacity="0.55"/>
      <line x1="240" y1="415" x2="280" y2="415" stroke-opacity="0.55"/>
      <line x1="246" y1="401" x2="274" y2="429" stroke-opacity="0.45"/>
      <line x1="274" y1="401" x2="246" y2="429" stroke-opacity="0.45"/>
    </g>
    <!-- Rear wheel -->
    <g>
      <circle cx="540" cy="415" r="32" stroke-width="2"/>
      <circle cx="540" cy="415" r="22" stroke-opacity="0.7" stroke-width="1.2"/>
      <circle cx="540" cy="415" r="8"  stroke-opacity="0.85" stroke-width="1.2"/>
      <line x1="540" y1="395" x2="540" y2="435" stroke-opacity="0.55"/>
      <line x1="520" y1="415" x2="560" y2="415" stroke-opacity="0.55"/>
      <line x1="526" y1="401" x2="554" y2="429" stroke-opacity="0.45"/>
      <line x1="554" y1="401" x2="526" y2="429" stroke-opacity="0.45"/>
    </g>
  </g>

  <!-- ============ DATA HOTSPOTS / TELEMETRY POINTS ============ -->
  <g font-family="Rajdhani, sans-serif" font-size="10" fill="#f0a500" letter-spacing="0.08em">
    <!-- Hotspot 1: Engine -->
    <circle cx="225" cy="370" r="3.5" fill="#f0a500" filter="url(#softGlow)"/>
    <circle cx="225" cy="370" r="6" fill="none" stroke="#f0a500" stroke-opacity="0.6"/>
    <line x1="228" y1="367" x2="270" y2="335" stroke="#f0a500" stroke-opacity="0.55" stroke-width="0.8"/>
    <line x1="270" y1="335" x2="320" y2="335" stroke="#f0a500" stroke-opacity="0.55" stroke-width="0.8"/>
    <text x="275" y="330" font-weight="600">ENGINE · 1.5L</text>
    <text x="275" y="345" fill="#8892a4" font-size="8.5" font-weight="500">PETROL · BS6</text>

    <!-- Hotspot 2: KM Driven -->
    <circle cx="540" cy="395" r="3.5" fill="#3b82f6" filter="url(#softGlow)"/>
    <circle cx="540" cy="395" r="6" fill="none" stroke="#3b82f6" stroke-opacity="0.6"/>
    <line x1="544" y1="395" x2="600" y2="395" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="0.8"/>
    <line x1="600" y1="395" x2="640" y2="395" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="0.8"/>
    <text x="608" y="390" fill="#3b82f6" font-weight="600">42,500 KM</text>
    <text x="608" y="404" fill="#8892a4" font-size="8.5" font-weight="500">LOW MILEAGE</text>

    <!-- Hotspot 3: Year / Resale -->
    <circle cx="450" cy="290" r="3.5" fill="#22c55e" filter="url(#softGlow)"/>
    <circle cx="450" cy="290" r="6" fill="none" stroke="#22c55e" stroke-opacity="0.6"/>
    <line x1="450" y1="287" x2="450" y2="245" stroke="#22c55e" stroke-opacity="0.55" stroke-width="0.8"/>
    <line x1="450" y1="245" x2="520" y2="245" stroke="#22c55e" stroke-opacity="0.55" stroke-width="0.8"/>
    <text x="455" y="240" fill="#22c55e" font-weight="600">2022 MODEL</text>
    <text x="455" y="253" fill="#8892a4" font-size="8.5" font-weight="500">FIRST OWNER</text>

    <!-- Hotspot 4: Price -->
    <circle cx="290" cy="300" r="3.5" fill="#f0a500" filter="url(#softGlow)"/>
    <circle cx="290" cy="300" r="6" fill="none" stroke="#f0a500" stroke-opacity="0.6"/>
    <line x1="290" y1="297" x2="290" y2="248" stroke="#f0a500" stroke-opacity="0.55" stroke-width="0.8"/>
    <line x1="290" y1="248" x2="200" y2="248" stroke="#f0a500" stroke-opacity="0.55" stroke-width="0.8"/>
    <text x="125" y="243" font-weight="700" font-size="11">₹ 5.24 L</text>
    <text x="125" y="256" fill="#8892a4" font-size="8.5" font-weight="500">PREDICTED PRICE</text>
  </g>

  <!-- ============ CORNER BRACKETS (HUD frame) ============ -->
  <g stroke="#f0a500" stroke-width="1.4" stroke-opacity="0.7" fill="none">
    <path d="M 40 50  L 40 80  M 40 50 L 70 50"/>
    <path d="M 760 50 L 760 80 M 760 50 L 730 50"/>
    <path d="M 40 550 L 40 520 M 40 550 L 70 550"/>
    <path d="M 760 550 L 760 520 M 760 550 L 730 550"/>
  </g>

  <!-- HUD top-left label -->
  <g font-family="Rajdhani, sans-serif" font-weight="700" letter-spacing="0.12em">
    <text x="55" y="40" font-size="10" fill="#f0a500">CARINSIGHT · DIGITAL TWIN</text>
    <text x="55" y="68" font-size="9" fill="#8892a4" letter-spacing="0.18em">ID · CIP-2026-IN</text>
  </g>

  <!-- HUD top-right scan indicator -->
  <g font-family="Rajdhani, sans-serif" font-weight="700">
    <circle cx="730" cy="38" r="3" fill="#22c55e" filter="url(#softGlow)"/>
    <text x="720" y="42" font-size="10" fill="#22c55e" text-anchor="end" letter-spacing="0.1em">LIVE · SCAN OK</text>
    <text x="720" y="56" font-size="9" fill="#8892a4" text-anchor="end" letter-spacing="0.12em">CONF · 95.0%</text>
  </g>

  <!-- HUD bottom telemetry strip -->
  <g font-family="Rajdhani, sans-serif" font-weight="600" fill="#8892a4" font-size="9" letter-spacing="0.14em">
    <text x="55" y="575">MAKE · MARUTI</text>
    <text x="200" y="575">MODEL · SWIFT VXI</text>
    <text x="370" y="575">FUEL · PETROL</text>
    <text x="510" y="575">TRANS · MANUAL</text>
    <text x="645" y="575" fill="#f0a500">R² 0.9501</text>
  </g>

  <!-- Subtle scanline overlay for the holographic feel -->
  <g opacity="0.06">
    <line x1="0" y1="120" x2="800" y2="120" stroke="#f0a500" stroke-width="0.4"/>
    <line x1="0" y1="180" x2="800" y2="180" stroke="#f0a500" stroke-width="0.4"/>
    <line x1="0" y1="240" x2="800" y2="240" stroke="#f0a500" stroke-width="0.4"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#f0a500" stroke-width="0.4"/>
    <line x1="0" y1="360" x2="800" y2="360" stroke="#f0a500" stroke-width="0.4"/>
    <line x1="0" y1="420" x2="800" y2="420" stroke="#f0a500" stroke-width="0.4"/>
    <line x1="0" y1="480" x2="800" y2="480" stroke="#f0a500" stroke-width="0.4"/>
  </g>
</svg>
