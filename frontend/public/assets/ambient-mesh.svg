<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="meshA" cx="0.15" cy="0.2" r="0.55">
      <stop offset="0%"  stop-color="#f0a500" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#f0a500" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#080a0f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshB" cx="0.85" cy="0.75" r="0.55">
      <stop offset="0%"  stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#080a0f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshC" cx="0.55" cy="0.45" r="0.45">
      <stop offset="0%"  stop-color="#22c55e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#080a0f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#f0a500" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0d1017"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#base)"/>
  <rect width="1600" height="900" fill="url(#dotGrid)"/>
  <rect width="1600" height="900" fill="url(#meshA)"/>
  <rect width="1600" height="900" fill="url(#meshB)"/>
  <rect width="1600" height="900" fill="url(#meshC)"/>

  <!-- Faint horizontal scanlines -->
  <g opacity="0.04">
    <line x1="0" y1="200" x2="1600" y2="200" stroke="#f0a500" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1600" y2="400" stroke="#f0a500" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1600" y2="600" stroke="#f0a500" stroke-width="0.5"/>
  </g>
</svg>
