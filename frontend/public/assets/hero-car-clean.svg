    <line x1="115" y1="463" x2="685" y2="463" stroke="#5b8fc7" stroke-opacity="0.32" stroke-width="0.7"/>
    <line x1="135" y1="488" x2="665" y2="488" stroke="#5b8fc7" stroke-opacity="0.24" stroke-width="0.6"/>
    <line x1="155" y1="515" x2="645" y2="515" stroke="#5b8fc7" stroke-opacity="0.16" stroke-width="0.55"/>
    <line x1="180" y1="555" x2="620" y2="555" stroke="#5b8fc7" stroke-opacity="0.10" stroke-width="0.5"/>
    <line x1="100" y1="440" x2="180" y2="555" stroke="#5b8fc7" stroke-opacity="0.30" stroke-width="0.6"/>
    <line x1="220" y1="440" x2="248" y2="555" stroke="#5b8fc7" stroke-opacity="0.22" stroke-width="0.6"/>
    <line x1="340" y1="440" x2="338" y2="555" stroke="#5b8fc7" stroke-opacity="0.22" stroke-width="0.6"/>
    <line x1="460" y1="440" x2="462" y2="555" stroke="#5b8fc7" stroke-opacity="0.22" stroke-width="0.6"/>
    <line x1="580" y1="440" x2="552" y2="555" stroke="#5b8fc7" stroke-opacity="0.22" stroke-width="0.6"/>
    <line x1="700" y1="440" x2="620" y2="555" stroke="#5b8fc7" stroke-opacity="0.30" stroke-width="0.6"/>
  </g>

  <!-- ============ FLOOR GLOW UNDER CAR ============ -->
  <ellipse cx="400" cy="440" rx="280" ry="55" fill="url(#floorGlow)"/>

  <!-- ============ CAR WIREFRAME ============ -->
  <g filter="url(#carGlow)" stroke="url(#gradBody)" stroke-width="1.6" fill="none">
    <path d="M 180 410 Q 200 425 240 425 L 560 425 Q 600 425 620 410" stroke-opacity="0.85"/>
