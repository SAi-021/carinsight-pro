    <line x1="425" y1="320" x2="425" y2="408" stroke-opacity="0.4"/>
    <line x1="510" y1="318" x2="510" y2="408" stroke-opacity="0.4"/>
    <line x1="385" y1="345" x2="405" y2="345" stroke-width="1.4"/>
    <line x1="445" y1="345" x2="470" y2="345" stroke-width="1.4"/>
    <path d="M 322 305 L 312 308 L 312 318 L 322 320" stroke-opacity="0.7"/>
    <g>
      <circle cx="260" cy="415" r="32" stroke-width="2"/>
      <circle cx="260" cy="415" r="22" stroke-opacity="0.7" stroke-width="1.2"/>
      <circle cx="260" cy="415" r="8"  stroke-opacity="0.85" stroke-width="1.2"/>
      <line x1="260" y1="395" x2="260" y2="435" stroke-opacity="0.55"/>
      <line x1="240" y1="415" x2="280" y2="415" stroke-opacity="0.55"/>
      <line x1="246" y1="401" x2="274" y2="429" stroke-opacity="0.45"/>
      <line x1="274" y1="401" x2="246" y2="429" stroke-opacity="0.45"/>
