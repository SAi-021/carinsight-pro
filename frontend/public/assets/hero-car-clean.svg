  <!-- ============ CORNER BRACKETS (HUD frame, subtle) ============ -->
  <g stroke="#5b8fc7" stroke-width="1.2" stroke-opacity="0.40" fill="none">
    <path d="M 40 50  L 40 80  M 40 50 L 70 50"/>
    <path d="M 760 50 L 760 80 M 760 50 L 730 50"/>
    <path d="M 40 550 L 40 520 M 40 550 L 70 550"/>
    <path d="M 760 550 L 760 520 M 760 550 L 730 550"/>
  </g>

  <!-- Subtle scanlines -->
  <g opacity="0.05">
    <line x1="0" y1="180" x2="800" y2="180" stroke="#5b8fc7" stroke-width="0.4"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#5b8fc7" stroke-width="0.4"/>
    <line x1="0" y1="420" x2="800" y2="420" stroke="#5b8fc7" stroke-width="0.4"/>
