<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <filter id="carGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gradBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ff9a5a"/>
      <stop offset="55%"  stop-color="#e8703a"/>
      <stop offset="100%" stop-color="#c14e1e" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="floorGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#e8703a" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#e8703a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0F2A43" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridFloor" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#5b8fc7" stroke-opacity="0.20" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- ============ PERSPECTIVE GRID FLOOR ============ -->
  <g opacity="0.55">
    <path d="M 100 440 L 700 440 L 620 555 L 180 555 Z" fill="url(#gridFloor)"/>
