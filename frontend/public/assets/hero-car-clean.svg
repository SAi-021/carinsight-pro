      <circle cx="540" cy="415" r="8"  stroke-opacity="0.85" stroke-width="1.2"/>
      <line x1="540" y1="395" x2="540" y2="435" stroke-opacity="0.55"/>
      <line x1="520" y1="415" x2="560" y2="415" stroke-opacity="0.55"/>
      <line x1="526" y1="401" x2="554" y2="429" stroke-opacity="0.45"/>
      <line x1="554" y1="401" x2="526" y2="429" stroke-opacity="0.45"/>
    </g>
